<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/ico.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/boot-loading.css" />
    <script>
      document.documentElement.classList.add('boot-pending');
      try {
        document.documentElement.dataset.bootTheme = localStorage.getItem('theme') || 'light';
      } catch { /* The default theme also works when storage is unavailable. */ }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- posterfy-seo:start -->
    <title>Posterfy</title>
    <!-- posterfy-seo:end -->

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NXSWH32M');</script>
    <!-- End Google Tag Manager -->

    <!-- Additional SEO -->
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Posterfy" />
    <meta name="apple-mobile-web-app-title" content="Posterfy" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Analytics - Will be loaded dynamically -->
    <!-- GA ID and domain will be set via environment variables -->
    
    <!-- Fonts with preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
    
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="boot-loading" class="posterfy-loading">
      <div class="posterfy-loading-art" role="status" aria-label="Posterfy">
        <div class="posterfy-loading-heart" aria-hidden="true">
          <div class="posterfy-loading-heart-core">
            <img src="/src/components/svgs/loading-heart.svg" width="511" height="464" alt="" fetchpriority="high" />
          </div>
        </div>
        <div class="posterfy-loading-name"><span class="posterfy-loading-title"><span class="posterfy-loading-brand">Posterfy</span><span class="posterfy-loading-domain">%VITE_DOMAIN%</span></span></div>
      </div>
      <p class="posterfy-loading-error" hidden>Unable to load Posterfy. <a href="">Reload</a></p>
    </div>
    <noscript><style>#boot-loading { display: none; }</style></noscript>
    <div id="root"></div>

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXSWH32M"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
     
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
